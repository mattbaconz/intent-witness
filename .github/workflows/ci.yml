name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  verify:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [20]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run schema:check
      - run: npm run evals:validate
      - run: npm run docs:check
      - run: npm run package:check
      - run: node scripts/install-cursor.mjs --check .
      - run: node scripts/install-cursor.mjs --check examples/demo-dashboard
      - run: npm ci
        working-directory: examples/demo-dashboard
      - run: npm run build
        working-directory: examples/demo-dashboard
